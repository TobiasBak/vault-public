interface:
  display_name: "Theodore Kaczynski Nullifier"
  short_description: "Set up repos for agents, cut measured waits, trace slow gates"
  default_prompt: "Use $theodore-kaczynski-nullifier when setting up or restructuring a repo for agents, when cutting a measured build, test, CI, gate or platform-run wait is the chosen work, when tracing slow gates, or when writing AGENTS.md. Aim at shorter PR lead time on a named product workflow, beside product work. Stop at the measured target or when a one-line edit reaches its verdict faster than a model turn."
