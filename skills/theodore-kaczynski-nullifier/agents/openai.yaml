interface:
  display_name: "Theodore Kaczynski Nullifier"
  short_description: "Self-explanatory repos and trustworthy agent output"
  default_prompt: "Use $theodore-kaczynski-nullifier to build repositories a fresh agent can understand, change correctly, inspect for actual outcomes, and recover when reality disagrees without human source review or repair. Treat the codebase as living documentation and keep prose to what the executable system cannot adequately express. Build trust through structure, enforced boundaries and independent behavioral evidence. Reuse shared infrastructure, fix measured feedback costs at their owner beside product work, then stop at the measured target."
